name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          retention-days: 7

  python-compatibility:
    name: Python XLSX compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Spartan859/Wota-Arrangement-Tool
          ref: d61296eb31b01b692c8fd3a30ee42578a4e59dca
          path: .compat-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install 'openpyxl>=3.1,<4'
      - run: npm test -- tests/python-compat.test.ts
        env:
          WOTA_CLI_PATH: ${{ github.workspace }}/.compat-cli
          PYTHON: python

  container:
    name: Container build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config -q
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: wota-arrangement-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --detach --name wota-web-ci \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:8080:8080 \
            wota-arrangement-web:ci-${{ github.sha }}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:8080/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs wota-web-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force wota-web-ci 2>/dev/null || true

  publish:
    name: Publish GHCR image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [web, python-compatibility, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
