name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          retention-days: 7

  python-compatibility:
    name: Python XLSX compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Spartan859/Wota-Arrangement-Tool
          ref: d61296eb31b01b692c8fd3a30ee42578a4e59dca
          path: .compat-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install 'openpyxl>=3.1,<4'
      - run: npm test -- tests/python-compat.test.ts
        env:
          WOTA_CLI_PATH: ${{ github.workspace }}/.compat-cli
          PYTHON: python

  container:
    name: Container build
    needs: web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wota
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: wota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wota -d wota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose config -q
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          push: false
          tags: wota-arrangement-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          load: true
          push: false
          tags: wota-arrangement-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --detach --name wota-web-ci \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:8080:8080 \
            wota-arrangement-web:ci-${{ github.sha }}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:8080/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs wota-web-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force wota-web-ci 2>/dev/null || true
      - name: API migration and smoke test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://wota:ci-password@127.0.0.1:5432/wota \
            -e SESSION_SECRET=ci-session-secret-at-least-32-characters \
            -e OIDC_ISSUER_URL=http://127.0.0.1:8081/realms/wota \
            -e OIDC_CLIENT_ID=wota-bff \
            -e OIDC_CLIENT_SECRET=ci-client-secret \
            -e AUDIO_STORAGE_DIR=/tmp/wota-audio \
            wota-arrangement-api:ci-${{ github.sha }} \
            node server-dist/db/migrate.js
          docker run --detach --name wota-api-ci --network host \
            -e DATABASE_URL=postgres://wota:ci-password@127.0.0.1:5432/wota \
            -e SESSION_SECRET=ci-session-secret-at-least-32-characters \
            -e OIDC_ISSUER_URL=http://127.0.0.1:8081/realms/wota \
            -e OIDC_CLIENT_ID=wota-bff \
            -e OIDC_CLIENT_SECRET=ci-client-secret \
            -e AUDIO_STORAGE_DIR=/tmp/wota-audio \
            -e HOST=127.0.0.1 \
            -e PORT=8787 \
            wota-arrangement-api:ci-${{ github.sha }}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs wota-api-ci
          exit 1
      - name: Stop API smoke-test container
        if: always()
        run: docker rm --force wota-api-ci 2>/dev/null || true

  publish:
    name: Publish GHCR image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [web, python-compatibility, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image names
        id: image
        run: |
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ${{ steps.image.outputs.web }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/metadata-action@v5
        id: meta-api
        with:
          images: ${{ steps.image.outputs.api }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
