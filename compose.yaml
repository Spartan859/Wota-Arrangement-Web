name: wota-arrangement-web

services:
  web:
    build:
      context: .
      target: runtime
    image: ${WOTA_WEB_IMAGE:-wota-arrangement-web:local}
    ports:
      - "127.0.0.1:${WOTA_WEB_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks: [wota]

  api:
    build:
      context: .
      target: api
    image: ${WOTA_API_IMAGE:-wota-arrangement-api:local}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      AUDIO_STORAGE_DIR: /data/audio
    volumes:
      - wota-audio:/data/audio
    ports:
      - "127.0.0.1:${WOTA_API_PORT:-8787}:8787"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      authentik-configure:
        condition: service_completed_successfully
    networks: [wota]

  migrate:
    build:
      context: .
      target: api
    image: ${WOTA_API_IMAGE:-wota-arrangement-api:local}
    command: ["node", "server-dist/db/migrate.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks: [wota]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wota}
    volumes:
      - wota-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-authentik.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [wota]

  authentik-db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-wota}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
    command:
      - sh
      - -ec
      - |
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'authentik'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE authentik"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [wota]

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: ["server"]
    env_file: .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-wota}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_HOSTNAME:-http://127.0.0.1:8081}
    volumes:
      - wota-authentik-data:/data
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    ports:
      - "127.0.0.1:${WOTA_AUTHENTIK_PORT:-8081}:9000"
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    networks: [wota]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: ["worker"]
    env_file: .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-wota}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_WEB__BASE_URL: ${AUTHENTIK_HOSTNAME:-http://127.0.0.1:8081}
    volumes:
      - wota-authentik-data:/data
      - ./docker/authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    networks: [wota]

  authentik-configure:
    build:
      context: .
      target: api
    image: ${WOTA_API_IMAGE:-wota-arrangement-api:local}
    command: ["node", "server-dist/scripts/configure-authentik.js"]
    env_file: .env
    depends_on:
      authentik-server:
        condition: service_healthy
      authentik-worker:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks: [wota]

  postfix:
    image: boky/postfix:v5.0.0
    profiles: ["production-mail"]
    environment:
      RELAYHOST: ${SMTP_RELAY_HOST:?set SMTP_RELAY_HOST in .env}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USERNAME:?set SMTP_RELAY_USERNAME in .env}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASSWORD:?set SMTP_RELAY_PASSWORD in .env}
      ALLOWED_SENDER_DOMAINS: ${SMTP_ALLOWED_SENDER_DOMAINS:-wota.satintin.com}
      POSTFIX_myhostname: ${SMTP_HELO_HOSTNAME:-mail.wota.satintin.com}
    restart: unless-stopped
    networks: [wota]

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["local-mail"]
    ports:
      - "127.0.0.1:${WOTA_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped
    networks: [wota]

volumes:
  wota-postgres:
  wota-audio:
  wota-authentik-data:

networks:
  wota:
    internal: false
