name: wota-arrangement-web

services:
  web:
    image: ${WOTA_IMAGE:?WOTA_IMAGE is required}
    ports:
      - "127.0.0.1:${WOTA_WEB_PORT:-18080}:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
